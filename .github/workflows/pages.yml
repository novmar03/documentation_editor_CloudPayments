name: Deploy editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: editor-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Check document operations
        run: node --experimental-strip-types tests/document.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The repository also has branch-based Pages enabled. Its raw-source
      # deployment must finish before the compiled Vite artifact is deployed.
      - name: Wait for branch-based Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 120; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, per_page: 100
              });
              const pending = data.workflow_runs.filter(run =>
                run.name === 'pages build and deployment' && run.status !== 'completed');
              if (!pending.length) return;
              core.info('Waiting for branch-based Pages deployment to finish');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Branch-based Pages deployment did not finish within 10 minutes');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
